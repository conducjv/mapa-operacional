<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Teste</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

#map {

    height: 100vh;

}

</style>

</head>

<body>

<div id="map"></div>

<script>

const map = L.map('map').setView(
    [39.1392, -0.3109],
    10
);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    maxZoom: 22
}).addTo(map);


// TESTE SIMPLES

fetch('data/equipos.json')

.then(r => r.json())

.then(data => {

    console.log(data);

    for(let i = 0; i < data.length; i++) {

        let eq = data[i];

        let lat = Number(eq.latitud);

        let lon = Number(eq.longitud);

        // separação
        lat += i * 0.00005;

        lon += i * 0.00005;

        L.marker([lat, lon])

        .addTo(map)

        .bindPopup(eq.equipo);

    }

})

.catch(err => {

    console.error(err);

    alert(err);

});

</script>

</body>

</html>
