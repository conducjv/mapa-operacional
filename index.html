<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Painel Operacional</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

html,
body {

    margin: 0;
    padding: 0;
    height: 100%;

}

#map {

    width: 100%;
    height: 100vh;

}

.leaflet-popup-content {

    width: 260px !important;

    max-height: 350px;

    overflow-y: auto;

    font-size: 14px;

    line-height: 1.4;

}

.popup-img {

    width: 100%;

    border-radius: 8px;

    margin-bottom: 10px;

}

.popup-qr {

    width: 100px;

    display: block;

    margin: auto;

    margin-bottom: 10px;

}

</style>

</head>

<body>

<div id="map"></div>

<script>

<script>

// ======================================
// MAPA
// ======================================

const map = L.map('map').setView(
    [39.1392, -0.3109],
    10
);

// ======================================
// SATÉLITE
// ======================================

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    maxZoom: 22
}).addTo(map);


// ======================================
// TESTE JSON
// ======================================

fetch('data/equipos.json')

.then(response => response.json())

.then(data => {

    console.log(data);

    data.forEach((equipo, i) => {

        // coordenadas
        let lat = Number(equipo.latitud);
        let lon = Number(equipo.longitud);

        // separação visual
        lat += (i * 0.00005);
        lon += (i * 0.00005);

        // marcador
        let marker = L.marker([
            lat,
            lon
        ]).addTo(map);

        // popup SIMPLES
        marker.bindPopup(

            "<b>" + equipo.equipo + "</b><br>" +

            equipo.descripcion

        );

    });

})

.catch(error => {

    console.error(error);

    alert(error);

});

</script>

</script>

</body>
</html>
