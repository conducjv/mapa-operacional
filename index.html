<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Painel Operacional</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

html,
body {

    margin: 0;
    padding: 0;
    height: 100%;

}

#map {

    width: 100%;
    height: 100vh;

}

.leaflet-popup-content {

    width: 260px !important;

    max-height: 350px;

    overflow-y: auto;

    font-size: 14px;

    line-height: 1.4;

}

.popup-img {

    width: 100%;

    border-radius: 8px;

    margin-bottom: 10px;

}

.popup-qr {

    width: 100px;

    display: block;

    margin: auto;

    margin-bottom: 10px;

}

</style>

</head>

<body>

<div id="map"></div>

<script>

// =====================================================
// MAPA
// =====================================================

const map = L.map('map').setView(
    [39.13923884350597, -0.31092408194865745],
    10
);

// =====================================================
// SATÉLITE
// =====================================================

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    maxZoom: 22
}).addTo(map);


// =====================================================
// PARÁMETROS QR
// =====================================================

const params = new URLSearchParams(window.location.search);

const equipoQR = params.get("equip");

const salaQR = params.get("sala");


// =====================================================
// SALA ELÉCTRICA
// =====================================================

const sala1 = L.marker([
    39.17523737845108,
    -0.2727694618862366
]).addTo(map);

sala1.bindPopup(`

<div>

<h2>ARMARIO ELÉCTRICO A</h2>

<img src="img/qr_sala1.png"
class="popup-qr">

<p>
Área de equipamientos eléctricos
</p>

<hr>

<h3>EPIs</h3>

<ul>
<li>Casco</li>
<li>Guantes</li>
<li>Gafas</li>
</ul>

<hr>

<h3>Documentación</h3>

<ul>

<li>
<a href="docs/LOTO.pdf"
target="_blank">

LOTO

</a>
</li>

</ul>

</div>

`);


// =====================================================
// QR SALA
// =====================================================

if (salaQR === "sala1") {

    map.setView([
        39.17523737845108,
        -0.2727694618862366
    ], 20);

    sala1.openPopup();

}


// =====================================================
// EQUIPOS JSON
// =====================================================

fetch('data/equipos.json')

.then(response => {

    if (!response.ok) {

        throw new Error(
            "JSON no encontrado"
        );

    }

    return response.json();

})

.then(equipos => {

    console.log("Equipos cargados:", equipos);

    equipos.forEach((equipo, index) => {

        // =================================================
        // DESPLAZAMIENTO AUTOMÁTICO
        // =================================================

        let lat = Number(equipo.latitud);

        let lon = Number(equipo.longitud);

        // separa equipos sobrepostos
        lat += (index % 5) * 0.00005;

        lon += (index % 5) * 0.00005;

        // =================================================
        // MARCADOR
        // =================================================

        const marker = L.marker([lat, lon])
        .addTo(map);

        // =================================================
        // POPUP
        // =================================================

        marker.bindPopup(`

        <div>

        <h2>${equipo.equipo || ""}</h2>

        ${
            equipo.foto_1
            ?
            `<img
            src="${equipo.foto_1}"
            class="popup-img">`
            :
            ""
        }

        <p>
        <b>Descripción:</b><br>
        ${equipo.descripcion || ""}
        </p>

        <p>
        <b>Marca:</b>
        ${equipo.marca || ""}
        </p>

        <p>
        <b>Modelo:</b>
        ${equipo.modelo || ""}
        </p>

        <p>
        <b>Ubicación:</b>
        ${equipo.ubicacion || ""}
        </p>

        <p>
        <b>Sala:</b>
        ${equipo.sala || ""}
        </p>

        <p>
        <b>Potencia:</b>
        ${equipo.potencia_kw || ""}
        kW
        </p>

        <p>
        <b>Status:</b>
        Operando
        </p>

        ${
            equipo.doc_tec
            ?
            `
            <hr>

            <a href="${equipo.doc_tec}"
            target="_blank">

            📄 Manual Técnico

            </a>
            `
            :
            ""
        }

        </div>

        `);

        // =================================================
        // QR AUTOMÁTICO
        // =================================================

        if (
            equipoQR &&
            equipoQR === equipo.equipo
        ) {

            map.setView([lat, lon], 20);

            setTimeout(() => {

                marker.openPopup();

            }, 1000);

        }

    });

})

.catch(error => {

    console.error(error);

    alert(
        "Error cargando JSON"
    );

});

</script>

</body>
</html>
