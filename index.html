<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Painel Operacional</title>


<!-- ===================================================== -->
<!-- LEAFLET -->
<!-- ===================================================== -->

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<!-- ===================================================== -->
<!-- MARKER CLUSTER -->
<!-- ===================================================== -->

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>


<style>

/* ===================================================== */
/* BODY */
/* ===================================================== */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

}


/* ===================================================== */
/* MAPA */
/* ===================================================== */

#map {

    width: 100%;
    height: 100vh;

}


/* ===================================================== */
/* POPUP */
/* ===================================================== */

.leaflet-popup-content {

    width: min(260px, 70vw) !important;

    max-height: 60vh;

    overflow-y: auto;

    font-size: 14px;

    line-height: 1.4;

}


/* ===================================================== */
/* IMAGENS */
/* ===================================================== */

.popup-img {

    width: 100%;

    border-radius: 10px;

    margin-bottom: 10px;

}


/* ===================================================== */
/* QR */
/* ===================================================== */

.popup-qr {

    width: 100px;

    display: block;

    margin: auto;

    margin-bottom: 10px;

}


/* ===================================================== */
/* CLUSTER MOBILE */
/* ===================================================== */

.marker-cluster {

    transform: scale(1.15);

}

</style>

</head>

<body>

<div id="map"></div>

<script>


// =====================================================
// MAPA
// =====================================================

const map = L.map('map', {

    tap: true,

    tapTolerance: 20,

    touchZoom: true,

    bounceAtZoomLimits: false

}).setView(

    [39.1752, -0.2730],

    17

);


// =====================================================
// SATÉLITE
// =====================================================

const satelliteLayer = L.tileLayer(

'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

{
    maxZoom: 19
}

).addTo(map);


// =====================================================
// OPEN STREET MAP
// =====================================================

const osmLayer = L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{
    maxZoom: 22
}

);


// =====================================================
// OVERLAY
// =====================================================

//const overlayLayer = L.imageOverlay(
//
//    'img/overlay.png',
//
//    [
//
        // CANTO INFERIOR IZQUIERDO
//        [39.1740, -0.2745],

        // CANTO SUPERIOR DERECHO
//        [39.1765, -0.2710]

//    ],

//    {

//        opacity: 0.65
//
//    }

//).addTo(map);


// =====================================================
// CONTROLE DE CAMADAS
// =====================================================

const baseMaps = {

    "Satélite": satelliteLayer,

    "Mapa": osmLayer

};

//const overlayMaps = {

//    "Planta": overlayLayer

//};

L.control.layers(

    baseMaps
//    overlayMaps

).addTo(map);


// =====================================================
// CLUSTER
// =====================================================

const markers = L.markerClusterGroup({

    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    disableClusteringAtZoom: 22,
    spiderfyDistanceMultiplier: 2,
    maxClusterRadius: 35

});


// =====================================================
// PARÂMETROS QR
// =====================================================

const params = new URLSearchParams(

    window.location.search

);

const equipoQR = params.get("equip");

const salaQR = params.get("sala");


// =====================================================
// SALA ELÉCTRICA
// =====================================================

const sala1 = L.marker([

    39.17523737845108,
    -0.2727694618862366

]).addTo(map);


sala1.bindPopup(`

<div>

<h2>ARMARIO ELÉCTRICO A</h2>

<img src="img/qr_sala1.png"
class="popup-qr">

<p>
Área de equipamientos eléctricos
</p>

<hr>

<h3>EPIs</h3>

<ul>

<li>Casco</li>
<li>Guantes</li>
<li>Gafas</li>
<li>Protección auditiva</li>

</ul>

<hr>

<h3>Documentación</h3>

<ul>

<li>

<a href="docs/LOTO.pdf"
target="_blank">

Procedimiento LOTO

</a>

</li>

</ul>

</div>

`, {

    maxWidth: 300

});


// =====================================================
// QR SALA
// =====================================================

if (salaQR === "sala1") {

    map.setView([

        39.17523737845108,
        -0.2727694618862366

    ], 19);

    sala1.openPopup();

}


// =====================================================
// CARGAR EQUIPOS JSON
// =====================================================

fetch('data/equipos.json')

.then(response => {

    if (!response.ok) {

        throw new Error(

            "No se pudo cargar equipos.json"

        );

    }

    return response.json();

})

.then(equipos => {

    console.log(

        "Equipos cargados:",
        equipos

    );

    equipos.forEach(eq => {

        // =================================================
        // VALIDAR COORDENADAS
        // =================================================

        let lat = Number(eq.latitud);

        let lon = Number(eq.longitud);

        if (

            isNaN(lat) ||
            isNaN(lon)

        ) {

            console.warn(

                "Coordenadas inválidas:",
                eq

            );

            return;

        }


        // =================================================
        // MARCADOR
        // =================================================

        const marker = L.marker([

            lat,
            lon

        ]);


        // =================================================
        // POPUP
        // =================================================

        marker.bindPopup(`

        <div>

        <h2>

        ${eq.equipo || ""}

        </h2>

        ${

            eq.foto_1

            ?

            `

            <img
            src="${eq.foto_1}"
            class="popup-img">

            `

            :

            ""

        }

        <p>

        <b>Descripción:</b><br>

        ${eq.descripcion || ""}

        </p>

        <p>

        <b>Marca:</b>

        ${eq.marca || ""}

        </p>

        <p>

        <b>Modelo:</b>

        ${eq.modelo || ""}

        </p>

        <p>

        <b>Ubicación:</b>

        ${eq.ubicacion || ""}

        </p>

        <p>

        <b>Sala:</b>

        ${eq.sala || ""}

        </p>

        <p>

        <b>Potencia:</b>

        ${eq.potencia_kw || ""}

        kW

        </p>

        <p>

        <b>Status:</b>

        Operando

        </p>

        ${

            eq.doc_tec

            ?

            `

            <hr>

            <a
            href="${eq.doc_tec}"
            target="_blank">

            📄 Manual Técnico

            </a>

            `

            :

            ""

        }

        </div>

        `);


        // =================================================
        // ADICIONAR AO CLUSTER
        // =================================================

        markers.addLayer(marker);


        // =================================================
        // QR EQUIPO
        // =================================================

        if (

            equipoQR &&
            equipoQR === eq.equipo

        ) {

            map.setView([

                lat,
                lon

            ], 19);

            setTimeout(() => {

                marker.openPopup();

            }, 1200);

        }

    });


    // =================================================
    // ADICIONAR CLUSTER AO MAPA
    // =================================================

    map.addLayer(markers);

})

.catch(error => {

    console.error(error);

    alert(

        "Error cargando equipos.json"

    );

});

</script>

</body>

</html>
