<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=0.75">


    <title>Painel Operacional</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map {
            height: 100vh;
        }
.leaflet-popup-content {

    width: 250px !important;

    max-height: 300px;

    overflow-y: auto;

    font-size: 14px;

    line-height: 1.4;

}


/* IMAGENS RESPONSIVAS */

.leaflet-popup-content img {

    max-width: 100%;

    height: auto;

    border-radius: 8px;

}

        
.leaflet-popup-content {

    font-size: 16px;
    line-height: 1.5;

}

.leaflet-popup-content img {

    max-width: 100%;

}

    </style>
</head>

<body>

<div id="map"></div>

<script>

// ======================================
// MAPA PRINCIPAL
// ======================================

var map = L.map('map', {

    tap: true,
    touchZoom: true,
    dragging: true,
    doubleClickZoom: true,
    scrollWheelZoom: true,
    boxZoom: true,
    keyboard: true

}).setView([39.13923884350597, -0.31092408194865745], 10);


// ======================================
// CAPA SATELITAL
// ======================================

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    maxZoom: 50
}).addTo(map);


// ======================================
// LEER PARÁMETROS QR
// ======================================

const params = new URLSearchParams(window.location.search);

const equipoQR = params.get("equip");

const salaQR = params.get("sala");




// ======================================
// FUNCIÓN ABRIR EQUIPO
// ======================================

function abrirEquipoP101() {

    marker1.openPopup();


}

// ======================================
// QR EQUIPO P101
// ======================================


if (equipoQR === "P101") {

    map.setView(
        [39.17525299251499, -0.2730448298564689],
        20
    );

    setTimeout(function() {

        marker1.openPopup();

    }, 1000);

}


// ======================================
// ARMARIO ELÉCTRICO A
// ======================================

var sala1 = L.marker([39.17523737845108, -0.2727694618862366]).addTo(map);

sala1.bindPopup(`

<h2>ARMARIO ELÉCTRICO A</h2>

<img src="img/qr_sala1.png" width="100">

<p>
Área de equipamientos eléctricos
</p>

<hr>

<h3>EPIs Obligatorios</h3>

<ul>
<li>Casco</li>
<li>Gafas de protección</li>
<li>Guantes aislantes</li>
<li>Protección auditiva</li>
</ul>

<hr>

<h3>Herramientas Necesarias</h3>

<ul>
<li>Multímetro CAT III</li>
<li>Detector de tensión tipo bolígrafo</li>
<li>Destornillador</li>
</ul>

<hr>

<h3>Equipos</h3>

<ul>

<li>

<a href="#"
onclick="abrirEquipoP101()">

P-101 - Bomba dosificadora

</a>

</li>

<li>P-102</li>
<li>VFD-01</li>

</ul>

<hr>

<h3>Documentación</h3>

<ul>

<li>
<a href="docs/LOTO.pdf" target="_blank">
Procedimiento LOTO
</a>
</li>

<li>
<a href="docs/eletrico.pdf" target="_blank">
Diagrama eléctrico
</a>
</li>

</ul>

`, {

    maxWidth: 350

});


// ======================================
// QR SALA ELÉCTRICA
// ======================================

if (salaQR === "sala1") {

    map.setView(
        [39.17523737845108, -0.2727694618862366],
        20
    );

    sala1.openPopup();

}



// ======================================
// DOSIFICACIÓN DE HIPOCLORITO
// ======================================

var marker1 = L.marker([39.17525299251499, -0.2730448298564689]).addTo(map);

marker1.bindPopup(`

<h2>P-101</h2>

<img src="img/qr_p101.png" width="100">

<img src="img/pump.jpg" width="180">

<p>Bombas dosificadoras de hipoclorito</p>

<p>Status: Operando</p>

<hr>

<h3>Documentos</h3>

<ul>

<li>

<a href="https://grupoelecnor-my.sharepoint.com/:b:/r/personal/rrodrigues_elecnor_es/Documents/ProyectoMapa/docs/985909-BA-SI-107-06-22-ES-Sigma-1-Basis-ES.pdf?csf=1&web=1&e=I9y4l6"
target="_blank">

Manual Técnico

</a>
</li>

<li>
<a href="https://grupoelecnor-my.sharepoint.com/:b:/r/personal/rrodrigues_elecnor_es/Documents/ProyectoMapa/docs/EBMarquesa.pdf?csf=1&web=1&e=t1BUfz"
target="_blank">

Documento de proceso

</a>
</li>

<li>
<a href="https://grupoelecnor-my.sharepoint.com/:b:/r/personal/rrodrigues_elecnor_es/Documents/ProyectoMapa/docs/ejemplo_AMFE.pdf?csf=1&web=1&e=AIi2xn"
target="_blank">

Ficha de equipos

</a>
</li>

<li>
<a href="https://grupoelecnor-my.sharepoint.com/:b:/r/personal/rrodrigues_elecnor_es/Documents/ProyectoMapa/docs/ejemplo_AMFE.pdf?csf=1&web=1&e=f0tkfc"
target="_blank">

Analise de Fallos

</a>
</li>

<li>

<a href="https://youtu.be/7EEzI0_tJkA?si=Q4Ncgo0tas44ryIZ"
target="_blank">

Video explicativo

</a>
</li>

</ul>

`, {

    maxWidth: 350

});



// ======================================
// CELDAS MEDIA TENSIÓN
// ======================================

var marker2 = L.marker([38.76989783359616, -0.8823027058956755]).addTo(map);

marker2.bindPopup(`

<h2>TK-01</h2>

<p>Celdas de media tensión - San Diego</p>

<p>Status: Operando</p>

`);



// ======================================
// BOMBAS EL PANSER
// ======================================

var marker3 = L.marker([39.13923884350597, -0.31092408194865745]).addTo(map);

marker3.bindPopup(`

<h2>motor_5</h2>

<p>Motor_5</p>

<p>Status: Operando</p>
<hr>

<h3>Documentos</h3>

<ul>

<li>

<a href="https://grupoelecnor-my.sharepoint.com/:b:/r/personal/rrodrigues_elecnor_es/Documents/ProyectoMapa/docs/468973838-Doc-Motor-Indar-ACP-560-X6-pdf.pdf
?csf=1&web=1&e=t1BUfz"
target="_blank">

Manual Tecnico

</a>
</li>

</ul>

`, {

    maxWidth: 350

});


// ======================================
// CARGAR EQUIPOS JSON
// ======================================

fetch('data/equipos.json')

.then(response => {

    console.log("STATUS:", response.status);

    return response.json();

})

.then(equipos => {

    console.log("JSON carregado:", equipos);

    equipos.forEach(equipo => {

        console.log(equipo);

        var marker = L.marker([
            equipo.latitud,
            equipo.longitud
        ]).addTo(map);

        marker.bindPopup(`

        <div style="width:250px">

        <h2>${equipo.equipo}</h2>

        ${
            equipo.foto_1
            ?
            `<img src="${equipo.foto_1}"
            style="width:100%;border-radius:10px">`
            :
            ""
        }

        <p>${equipo.descripcion || ""}</p>

        <p>
        <b>Marca:</b>
        ${equipo.marca || ""}
        </p>

        <p>
        <b>Modelo:</b>
        ${equipo.modelo || ""}
        </p>

        <p>
        <b>Ubicación:</b>
        ${equipo.ubicacion || ""}
        </p>

        <p>
        <b>Status:</b>
        ${equipo.estado || "Operando"}
        </p>

        ${
            equipo.doc_tec
            ?
            `
            <hr>

            <a href="${equipo.doc_tec}"
            target="_blank">

            Manual Técnico

            </a>
            `
            :
            ""
        }

        </div>

        `);

    });

})

.catch(error => {

    console.error("ERROR:", error);

});



    
</script>





</html>
